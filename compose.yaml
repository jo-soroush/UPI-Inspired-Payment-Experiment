services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upi_payment_test
      POSTGRES_USER: upi
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upi -d upi_payment_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
