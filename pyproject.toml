[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-payment-experiment"
version = "0.1.0"
description = "Minimal baseline for the UPI-inspired payment experiment"
dependencies = ["fastapi>=0.115,<1", "psycopg[binary]>=3,<4"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
upi_payment_experiment = ["postgres_schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]
